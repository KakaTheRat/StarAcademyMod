name: Build Academy Mod

on:
  push:
    branches:
      - 1.20.1
      - 1.21.1
      - 1.21.1-v2
  pull_request:
    branches:
      - 1.20.1
      - 1.21.1
      - 1.21.1-v2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup JDK 21
        uses: actions/setup-java@v4.5.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Cache Gradle Files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/*.gradle.kts*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Publish to Github Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :fabric:build :fabric:publish

      - name: Retrieve Version
        id: get_version
        run: |
          VERSION_NAME=$(./gradlew -q :fabric:printVersion)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Print Version
        run: |
          echo "Version: ${{ steps.get_version.outputs.VERSION_NAME }}"

      - name: Compile Version Message
        id: embed
        uses: actions/github-script@v7
        with:
          script: |
            const gh = ${{ toJSON(github) }};
            const version = "${{ steps.get_version.outputs.VERSION_NAME }}";

            core.setOutput('EMBED_TITLE', "[" + gh.event.repository.name + ":" + gh.ref_name +"] New Build [${{steps.get_version.outputs.VERSION_NAME}}]");
            core.setOutput('EMBED_URL', "https://github.com/KakaTheReal/StarAcademyMod/packages/2603833?version=" + encodeURIComponent(version));
            core.setOutput('EMBED_AUTHOR_NAME', gh.event.sender.login);
            core.setOutput('EMBED_AUTHOR_ICON_URL', gh.event.sender.avatar_url);

            const commits = ${{ toJSON(github.event.commits) }};
            let description = "";

            for(const commit of commits) {
              if(description.length !== 0) {
                description += "\n";
              }

              description += " [" + commit.id.slice(0,7) + "](<" + commit.url + ">) " + commit.message + " - " + commit.author.username;
            }

            core.setOutput('EMBED_DESCRIPTION', description);

      - name: Upload Artifact (Download your JAR here)
        uses: actions/upload-artifact@v4
        with:
          name: Academy-Mod-Jar
          path: fabric/build/libs/*.jar

      - name: Cleanup Old Artifacts
        uses: actions/delete-package-versions@v5
        with:
          package-name: "abeshutt.academy"
          min-versions-to-keep: 10
          package-type: "maven"
